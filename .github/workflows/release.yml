name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: npm ci

      - name: Check tag matches app version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "Tag v$TAG does not match package.json ($PKG), Cargo.toml ($CARGO), or tauri.conf.json ($CONF)"
            exit 1
          fi
          node - "$TAG" <<'NODE'
          const { readFileSync } = require("node:fs");
          const version = process.argv[2];
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const heading = new RegExp(
            `^## \\[${escaped}\\](?: - \\d{4}-\\d{2}-\\d{2})?$`,
            "m",
          );
          if (!heading.test(readFileSync("CHANGELOG.md", "utf8"))) {
            console.error(`CHANGELOG.md has no valid release section for ${version}`);
            process.exit(1);
          }
          NODE

      - name: Write release config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const pubkey = (process.env.TAURI_UPDATER_PUBKEY || "").trim();
          if (!pubkey) {
            console.error("TAURI_UPDATER_PUBKEY is required");
            process.exit(1);
          }
          const endpoint =
            "https://github.com/ripudaman5ingh/BONOCODE/releases/latest/download/latest.json";
          writeFileSync(
            process.env.RUNNER_TEMP + "/tauri.release.conf.json",
            JSON.stringify(
              {
                plugins: {
                  updater: {
                    pubkey,
                    endpoints: [endpoint],
                  },
                },
              },
              null,
              2,
            ),
          );
          NODE

      - name: Build macOS packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/tauri.release.conf.json"

      - name: Verify macOS package architectures and signatures
        run: |
          set -euo pipefail
          verify_app() {
            local app="$1"
            local expected_arch="$2"
            local executable
            local actual_arch
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            actual_arch=$(lipo -archs "$app/Contents/MacOS/$executable")
            if [[ "$actual_arch" != "$expected_arch" ]]; then
              echo "Expected $app to contain only $expected_arch, got: $actual_arch" >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app"
          }
          verify_app "target/aarch64-apple-darwin/release/bundle/macos/Bonocode.app" arm64

      - name: Write release notes and updater feed
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="target/aarch64-apple-darwin/release/bundle/macos/Bonocode.app.tar.gz"
          if [[ ! -f "$ARCHIVE" || ! -f "$ARCHIVE.sig" ]]; then
            echo "Missing updater archive or signature: $ARCHIVE" >&2
            exit 1
          fi
          VERSION="$VERSION" ARCHIVE_SIG="$ARCHIVE.sig" node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const version = process.env.VERSION;
          const lines = readFileSync("CHANGELOG.md", "utf8").split("\n");
          const start = lines.findIndex(
            (line) => line === `## [${version}]` || line.startsWith(`## [${version}] - `),
          );
          if (start === -1) {
            console.error(`CHANGELOG.md has no section for ${version}`);
            process.exit(1);
          }
          const next = lines.findIndex((line, i) => i > start && line.startsWith("## "));
          const notes = lines
            .slice(start + 1, next === -1 ? lines.length : next)
            .join("\n")
            .trim();
          if (!notes) {
            console.error(`CHANGELOG.md section for ${version} is empty`);
            process.exit(1);
          }
          writeFileSync(process.env.RUNNER_TEMP + "/release-notes.md", notes + "\n");
          const feed = {
            version,
            notes,
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": {
                signature: readFileSync(process.env.ARCHIVE_SIG, "utf8").trim(),
                url: `https://github.com/ripudaman5ingh/BONOCODE/releases/download/${process.env.GITHUB_REF_NAME}/Bonocode.app.tar.gz`,
              },
            },
          };
          writeFileSync("latest.json", JSON.stringify(feed, null, 2) + "\n");
          NODE

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="target/aarch64-apple-darwin/release/bundle"
          ARM_TAR="$BUNDLE/macos/Bonocode.app.tar.gz"
          ARM_SIG="${ARM_TAR}.sig"
          ARM_DMG="$BUNDLE/dmg/Bonocode_${VERSION}_aarch64.dmg"
          RELEASE_FILES=("$ARM_DMG" "$ARM_TAR" "$ARM_SIG" latest.json)
          for artifact in "${RELEASE_FILES[@]}"; do
            if [[ ! -f "$artifact" ]]; then
              echo "Missing release artifact: $artifact" >&2
              exit 1
            fi
          done
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "Bonocode $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          verify_release() {
            local expected_draft="$1"
            gh release view "$GITHUB_REF_NAME" --json isDraft,assets > "$RUNNER_TEMP/release-state.json"
            node - "$RUNNER_TEMP/release-state.json" "$expected_draft" "${RELEASE_FILES[@]}" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const release = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (release.isDraft !== (process.argv[3] === "true")) {
            console.error("GitHub Release publication state is unexpected.");
            process.exit(1);
          }
          const names = new Set(release.assets.map((asset) => asset.name));
          for (const file of process.argv.slice(4)) {
            const name = path.basename(file);
            if (!names.has(name)) {
              console.error(`GitHub Release is missing ${name}.`);
              process.exit(1);
            }
          }
          NODE
          }
          IS_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [[ "$IS_DRAFT" == true ]]; then
            # Draft assets can be replaced after an interrupted upload. A
            # published release is immutable, so only resume drafts.
            # latest.json is uploaded with the draft, so the updater feed goes
            # live only when the release is published.
            gh release upload "$GITHUB_REF_NAME" "${RELEASE_FILES[@]}" --clobber
            verify_release true
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          elif [[ "$IS_DRAFT" != false ]]; then
            echo "Unexpected GitHub Release state: $IS_DRAFT" >&2
            exit 1
          fi
          verify_release false
