<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/bonocode.png" />
    <title>Bonocode</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          // Written by the theme engine (themeEngine.ts) on every apply.
          try {
            var cache = JSON.parse(
              localStorage.getItem("bonocode.themeCache") || "null",
            );
            if (cache && typeof cache.vars === "object" && cache.vars) {
              for (var name in cache.vars) {
                if (typeof cache.vars[name] === "string") {
                  root.style.setProperty(name, cache.vars[name]);
                }
              }
              if (typeof cache.vars["--user-accent-color"] === "string") {
                root.classList.add("has-user-accent");
              }
            }
            if (cache && cache.scheme === "light") {
              root.classList.add("theme-light");
            }
          } catch (_) {}
          var opacity = localStorage.getItem("bonocode.sidebarOpacity");
          if (opacity != null) {
            var o = Math.max(0.15, Math.min(1, Number(opacity) || 0.85));
            root.style.setProperty("--sidebar-opacity", String(o));
          }
          var bodyGlass = localStorage.getItem("bonocode.bodyGlass");
          if (bodyGlass == null || bodyGlass === "1" || bodyGlass === "true") {
            root.classList.add("glass-body");
          }
          var isMac =
            typeof navigator !== "undefined" &&
            /Mac|iPhone|iPad/.test(navigator.platform);
          if (isMac) {
            root.classList.add("is-mac");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --sidebar-opacity: 0.85;
        --color-background-base: #171717;
      }

      html,
      body,
      #boot-splash {
        margin: 0;
        background: var(--color-background-base);
      }

      /* Opaque cover until React paints. The logo is in HTML so it is
         visible during the Dock bounce, before the bundle runs. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: opacity 0.16s ease;
      }

      #boot-splash.boot-splash-out {
        opacity: 0;
      }

      #boot-splash img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/bonocode.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
